name: Finalize Nightgram 2FA
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[2fa-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and harden AuthScreen
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p = Path('src/components/AuthScreen.tsx')
          original = subprocess.check_output(['git','show','d2f7f5f11504458a5a9526ef6c5160f272774b12:src/components/AuthScreen.tsx'], text=True)
          p.write_text(original)
          s = original
          s = s.replace("import { sendVerificationCodeToEmail, getWebmailUrl } from '../lib/emailService';", "import { sendVerificationCodeToEmail, verifyVerificationCode, getWebmailUrl } from '../lib/emailService';")
          s = s.replace("  const [twoFactorCode, setTwoFactorCode] = useState('');\n", "")
          s = s.replace("  const [showCodePeek, setShowCodePeek] = useState(false);\n", "")
          s = s.replace("  const [notificationToast, setNotificationToast] = useState<{ show: boolean; code: string; email: string } | null>(null);", "  const [notificationToast, setNotificationToast] = useState<{ show: boolean; email: string } | null>(null);\n  const [otpVerifying, setOtpVerifying] = useState(false);")
          s = re.sub(r"  // Helper to generate and initiate 2FA verification challenge and dispatch to email\n  const initiateTwoFactorVerification = async .*?\n  };\n\n  // If component loaded", '''  // Start a server-generated 2FA verification challenge and dispatch it to email.
  const initiateTwoFactorVerification = async (profileData: any, userEmail: string) => {
    const cleanTargetEmail = (userEmail || profileData?.email || email || '').trim().toLowerCase();
    setPendingProfile(profileData);
    setTwoFactorEmail(cleanTargetEmail);
    setOtpDigits(['', '', '', '', '', '']);
    setOtpError('');
    setOtpSuccess(false);
    setTimeLeft(600);
    setResendCooldown(30);
    setTwoFactorStage(true);
    setEmailSending(true);
    setEmailSentTimestamp('');
    setNotificationToast({ show: true, email: cleanTargetEmail });
    setWebmailData(getWebmailUrl(cleanTargetEmail));
    try {
      const dispatchResult = await sendVerificationCodeToEmail(cleanTargetEmail, undefined, profileData);
      setEmailSentTimestamp(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      if (dispatchResult.providerName) setWebmailData({ name: dispatchResult.providerName, url: dispatchResult.webmailUrl, searchUrl: dispatchResult.webmailUrl });
    } catch (sendErr: any) {
      console.warn('Verification email dispatch issue handled:', sendErr);
      setOtpError(sendErr?.message || 'Could not send the verification email. Please try again.');
    } finally {
      setEmailSending(false);
    }
  };

  // If component loaded''', s, count=1, flags=re.S)
          s = s.replace("if (pendingTwoFactorUser && !twoFactorCode)", "if (pendingTwoFactorUser && !emailSentTimestamp)")
          s = re.sub(r"  // Handle Quick Fill helper for immediate verification\n  const handleQuickFill = \(\) => \{.*?\n  \};\n\n", "", s, count=1, flags=re.S)
          s = re.sub(r"  // Verify OTP submission\n  const handleVerifyOtp = \(codeToCheck\?: string\) => \{.*?\n  \};\n\n  // Resend code handler", '''  // Verify OTP on the authenticated Supabase Edge Function.
  const handleVerifyOtp = async (codeToCheck?: string) => {
    const code = (codeToCheck || otpDigits.join('')).trim();
    if (!/^\\d{6}$/.test(code)) { setOtpError('Please enter all 6 digits of the code.'); return; }
    if (timeLeft <= 0) { setOtpError('Verification code has expired. Please click Resend Code.'); return; }
    if (otpVerifying || otpSuccess) return;
    setOtpVerifying(true);
    setOtpError('');
    try {
      await verifyVerificationCode(twoFactorEmail, code);
      setOtpSuccess(true);
      if (pendingProfile?.uid) sessionStorage.setItem(`nightgram_2fa_${pendingProfile.uid}`, 'true');
      setTimeout(() => onAuthSuccess(pendingProfile), 700);
    } catch (verifyErr: any) {
      setOtpError(verifyErr?.message || 'Invalid verification code. Please check your email and try again.');
    } finally {
      setOtpVerifying(false);
    }
  };

  // Resend code handler''', s, count=1, flags=re.S)
          s = re.sub(r"  // Resend code handler\n  const handleResendCode = async \(\) => \{.*?\n  \};\n\n  // Cancel 2FA", '''  // Resend code handler
  const handleResendCode = async () => {
    if (resendCooldown > 0 || emailSending || otpSuccess) return;
    setOtpDigits(['', '', '', '', '', '']);
    setOtpError('');
    setTimeLeft(600);
    setResendCooldown(30);
    setEmailSending(true);
    try {
      const dispatchResult = await sendVerificationCodeToEmail(twoFactorEmail, undefined, pendingProfile);
      setEmailSentTimestamp(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
      setNotificationToast({ show: true, email: twoFactorEmail });
      if (dispatchResult.providerName) setWebmailData({ name: dispatchResult.providerName, url: dispatchResult.webmailUrl, searchUrl: dispatchResult.webmailUrl });
    } catch (err: any) {
      setOtpError(err?.message || 'Could not resend the verification email.');
    } finally {
      setEmailSending(false);
    }
    otpInputRefs[0]?.current?.focus();
  };

  // Cancel 2FA''', s, count=1, flags=re.S)
          s = s.replace("    setTwoFactorCode('');\n", "")
          s = re.sub(r"\n            /\*\*? Sandbox Testing Backup Toggle \*\*?\*/.*?\n            </div>\n\n            /\*\*? Back / Switch Account", "\n            {/* Back / Switch Account", s, count=1, flags=re.S)
          s = re.sub(r"\n\s*\{showCodePeek && \(.*?\n\s*\)\}", "", s, count=1, flags=re.S)
          s = re.sub(r"\n\s*<button\n\s*type=\"button\"\n\s*onClick=\{\(\) => setShowCodePeek\(!showCodePeek\)\}.*?</button>", "", s, count=1, flags=re.S)
          s = s.replace("disabled={otpSuccess || otpDigits.join('').length < 6}", "disabled={otpSuccess || otpVerifying || otpDigits.join('').length < 6}")
          s = s.replace("<span>Verify Email & Enter Nightgram</span>", "<span>{otpVerifying ? 'Verifying...' : 'Verify Email & Enter Nightgram'}</span>")
          s = re.sub(r"\n\s*<button\n\s*type=\"button\"\n\s*onClick=\{handleQuickFill\}.*?</button>", "", s, count=1, flags=re.S)
          p.write_text(s)
          assert 'verifyVerificationCode' in s
          assert 'twoFactorCode' not in s
          assert 'showCodePeek' not in s
          assert 'handleQuickFill' not in s
      - name: Build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AuthScreen.tsx
          git commit -m "Harden server-side 2FA [2fa-finalized]"
          git rm .github/workflows/finalize-2fa.yml
          git commit -m "Remove temporary 2FA finalization workflow [2fa-finalized]"
          git push origin main
